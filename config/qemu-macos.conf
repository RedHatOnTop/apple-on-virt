# QEMU Configuration for macOS Monterey ARM64
# Last updated: 2025-12-16
#
# This configuration file defines QEMU settings optimized for running
# macOS Monterey ARM64 on Apple Silicon hosts with HVF acceleration.

[machine]
# Virtual ARM64 platform with high memory support
type = virt
highmem = on

[cpu]
# Use host CPU for optimal performance on Apple Silicon
model = host

[memory]
# Minimum 4GB recommended, 8GB+ preferred
size = 4G

[smp]
# Number of virtual CPUs (adjust based on host)
cpus = 4

[accelerator]
# HVF for macOS hosts, KVM for Linux ARM64 hosts
# Fallback to TCG if neither available
hvf = on

[firmware]
# EDK2 UEFI firmware for AArch64
# Path varies by installation method
bios = /usr/share/edk2/aarch64/QEMU_EFI.fd

[drive.system]
# Main macOS system disk
file = mac_hdd.img
interface = virtio
format = qcow2
cache = writethrough

[drive.installer]
# macOS installer image (optional, for initial setup)
file = BaseSystem.img
interface = mtd
format = raw
readonly = on

[device.gpu]
# Primary GPU device
type = virtio-gpu-pci

[device.gpu-fallback]
# Fallback framebuffer for compatibility
type = ramfb

[device.network]
# Paravirtualized network adapter
type = virtio-net-pci
netdev = user

[device.usb]
# USB controller for input devices
type = usb-ehci

[device.keyboard]
type = usb-kbd

[device.mouse]
type = usb-mouse

[display]
# macOS native display with GPU acceleration
backend = cocoa
gl = on

[network.user]
# User-mode networking (NAT)
type = user
